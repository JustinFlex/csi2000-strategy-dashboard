<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中证2000策略观察 | GoFinTech Quant</title>
  <meta name="description" content="中证2000策略公开观察页，展示本期信号、净值曲线和核心表现指标。" />
  <meta name="theme-color" content="#0b806f" />
  <meta property="og:title" content="中证2000策略观察" />
  <meta property="og:description" content="跟踪本期信号、净值曲线和核心表现指标。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://quant002.gofintech.cn/" />
  <link rel="canonical" href="https://quant002.gofintech.cn/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #172033;
      --muted: #667085;
      --line: #dde5ef;
      --line-soft: #eef2f7;
      --blue: #255e91;
      --blue-soft: #eaf3fb;
      --green: #0b806f;
      --green-soft: #e7f6f2;
      --amber: #b26a00;
      --amber-soft: #fff4dc;
      --red: #b0443d;
      --shadow: 0 18px 45px rgba(21, 39, 65, 0.10);
      --shadow-soft: 0 8px 24px rgba(21, 39, 65, 0.07);
      --hero: #f8fbff;
      --hero-line: #d8e7f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        linear-gradient(180deg, var(--hero) 0 292px, var(--bg) 292px 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
      min-width: 320px;
    }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 26px 24px 34px;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      min-height: 202px;
      color: var(--ink);
    }
    .hero-copy { max-width: 780px; }
    .brand-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--green), var(--blue));
      color: #ffffff;
      font-size: 15px;
      font-weight: 850;
      box-shadow: 0 10px 24px rgba(11, 128, 111, 0.18);
    }
    .brand-name {
      color: #516070;
      font-size: 13px;
      font-weight: 760;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 10px;
      border: 1px solid rgba(11, 128, 111, 0.18);
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.16;
      font-weight: 800;
      letter-spacing: 0;
    }
    .meta {
      color: #526274;
      font-size: 14px;
      line-height: 1.6;
      max-width: 820px;
    }
    .hero-side {
      display: grid;
      justify-items: end;
      gap: 8px;
      min-width: 180px;
    }
    .badge-label {
      color: #6b7787;
      font-size: 12px;
      font-weight: 700;
    }
    .badge {
      min-width: 142px;
      padding: 13px 18px;
      border: 1px solid rgba(11, 128, 111, 0.28);
      border-radius: 8px;
      background: #ffffff;
      color: var(--green);
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      box-shadow: var(--shadow-soft);
    }
    .badge.skip {
      color: var(--amber);
      border-color: rgba(178, 106, 0, 0.25);
      background: #ffffff;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin: 4px 0 16px;
    }
    .kpi, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
    }
    .kpi {
      position: relative;
      min-height: 112px;
      padding: 15px;
      overflow: hidden;
    }
    .kpi::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--blue);
    }
    .kpi.is-action::before { background: var(--green); }
    .kpi.is-risk::before { background: var(--amber); }
    .kpi.is-action {
      background: linear-gradient(180deg, #ffffff 0%, var(--green-soft) 160%);
    }
    .kpi-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .kpi-value {
      font-size: 25px;
      line-height: 1.15;
      font-weight: 800;
      white-space: nowrap;
      color: var(--ink);
    }
    .kpi span {
      display: block;
      color: var(--muted);
      margin-top: 7px;
      font-size: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 16px;
    }
    .wide-panel {
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .panel {
      padding: 18px;
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .panel h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 800;
    }
    .section-kicker {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
    }
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #ffffff;
    }
    th, td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--line-soft);
      text-align: right;
      white-space: nowrap;
    }
    th {
      color: #475467;
      background: var(--panel-soft);
      font-size: 12px;
      font-weight: 800;
    }
    th:first-child, td:first-child { text-align: left; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fbfdff; }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
    }
    .metric-pos { color: var(--green); font-weight: 800; }
    .metric-risk { color: var(--red); font-weight: 800; }
    .note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      margin-top: 12px;
    }
    .chart-shell {
      position: relative;
      width: 100%;
      min-height: 342px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: linear-gradient(180deg, #fbfdff 0%, #ffffff 100%);
      overflow: hidden;
    }
    .chart {
      display: block;
      width: 100%;
      height: auto;
      min-height: 320px;
      touch-action: none;
    }
    .plot-bg { fill: rgba(21, 95, 159, 0.035); }
    .chart-title { font-size: 16px; font-weight: 800; fill: var(--ink); }
    .chart-subtitle { font-size: 12px; fill: var(--muted); }
    .axis-label { font-size: 11px; fill: var(--muted); }
    .grid-line { stroke: #e4eaf2; stroke-width: 1; }
    .axis-line { stroke: #b8c4d2; stroke-width: 1; }
    .nav-line {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .legend-text { font-size: 12px; font-weight: 700; fill: #475467; }
    .crosshair {
      pointer-events: none;
      display: none;
    }
    .crosshair line {
      stroke: #7d8794;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }
    .crosshair circle {
      stroke: #ffffff;
      stroke-width: 2;
    }
    .tooltip {
      position: absolute;
      display: none;
      min-width: 168px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      z-index: 2;
    }
    .tooltip strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .tooltip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      white-space: nowrap;
    }
    .swatch {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: 0;
    }
    .status {
      display: grid;
      gap: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      min-height: 54px;
      border-bottom: 1px solid var(--line-soft);
    }
    .status-item:last-child {
      border-bottom: 0;
    }
    .status-item strong {
      display: block;
      font-size: 15px;
      font-weight: 800;
      text-align: right;
    }
    .status-item span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .load-error {
      color: var(--red);
      font-size: 13px;
      padding: 12px;
      border: 1px solid rgba(185, 74, 59, 0.28);
      border-radius: 8px;
      background: rgba(185, 74, 59, 0.06);
    }
    footer {
      color: var(--muted);
      font-size: 12px;
      padding: 18px 0 0;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95em;
    }
    @media (max-width: 900px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .hero {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }
      .hero-side {
        justify-items: start;
        min-width: 0;
      }
    }
    @media (max-width: 560px) {
      body {
        background: linear-gradient(180deg, var(--hero) 0 372px, var(--bg) 372px 100%);
      }
      .shell { padding: 18px 14px 26px; }
      .hero { min-height: 278px; }
      h1 { font-size: 25px; }
      .meta { font-size: 13px; }
      .badge { width: 100%; }
      .kpis { grid-template-columns: 1fr; }
      .kpi { min-height: 96px; }
      .panel { padding: 14px; }
      .section-head { flex-direction: column; }
      th, td { padding: 10px 9px; }
      .chart-shell { min-height: 288px; }
      .chart { min-height: 270px; }
      .status-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
      .status-item strong { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="hero-copy">
        <div class="brand-line">
          <span class="brand-mark">Q</span>
          <span class="brand-name">GoFinTech Quant</span>
          <span class="eyebrow">公开观察</span>
        </div>
        <h1>中证2000策略观察</h1>
        <div class="meta" id="snapshotMeta">数据更新中</div>
        <div class="meta">用一页看清本期信号、净值走势和关键表现，适合持续跟踪小盘风格的市场节奏。</div>
      </div>
      <div class="hero-side">
        <div class="badge-label">本期信号</div>
        <div class="badge" id="actionBadge">...</div>
      </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="panel wide-panel">
      <div class="section-head">
        <div>
          <h2>累计收益 / 净值曲线</h2>
          <div class="section-kicker">跟踪策略和可交易 ETF 的净值变化。</div>
        </div>
      </div>
      <div class="chart-shell" id="chartShell">
        <svg class="chart" id="navChart" viewBox="0 0 960 340" role="img" aria-label="策略和 ETF 净值曲线"></svg>
        <div class="tooltip" id="chartTooltip"></div>
      </div>
      <div class="note">图表展示月度净值变化，便于观察趋势和阶段回撤。</div>
    </section>

    <section class="grid">
      <div class="panel">
        <div class="section-head">
          <div>
            <h2>核心表现</h2>
            <div class="section-kicker">收益、回撤和净值表现。</div>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>观察对象</th>
                <th>口径</th>
                <th>年化</th>
                <th>最大回撤</th>
                <th>收益回撤比</th>
                <th>净值</th>
              </tr>
            </thead>
            <tbody id="performanceRows"></tbody>
          </table>
        </div>
        <div class="note">指标随公开快照更新，仅作观察交流，不构成投资建议。</div>
      </div>

      <div class="panel">
        <div class="section-head">
          <div>
            <h2>观察日历</h2>
            <div class="section-kicker">当前信号与下一次观察时间。</div>
          </div>
        </div>
        <div class="status" id="statusGrid"></div>
        <div class="note">更新节奏以页面展示的日期为准。</div>
      </div>
    </section>

    <footer>公开信息仅作策略观察与交流，不构成任何投资建议。</footer>
  </main>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const WIDTH = 960;
    const HEIGHT = 340;
    const PAD = { left: 62, right: 28, top: 52, bottom: 54 };

    const $ = (id) => document.getElementById(id);

    function createSvg(tag, attrs = {}) {
      const el = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function monthToDate(month) {
      const [year, mon] = month.split("-").map(Number);
      return new Date(Date.UTC(year, mon - 1, 1));
    }

    function formatMonthFromTs(ts) {
      const d = new Date(ts);
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, "0");
      return `${y}-${m}`;
    }

    function roundUp(value, step) {
      return Math.ceil(value / step) * step;
    }

    function signalText(action) {
      return action === "TRADE" ? "信号亮起" : "等待观察";
    }

    function kpiView(item, index) {
      const labels = ["本期信号", "指数年化", "ETF年化", "指数收益回撤", "ETF收益回撤"];
      const subs = {
        "Next Action": (value) => value.replace("target ", "下次观察 "),
        "Index Annualized": () => "中证2000指数",
        "ETF Annualized": () => "可交易ETF",
        "Index Calmar": () => "收益回撤比",
        "ETF Calmar": () => "收益回撤比",
      };
      const value = index === 0 ? signalText(item.value) : item.value;
      const sub = subs[item.label] ? subs[item.label](item.sub) : item.sub;
      return {
        label: labels[index] || item.label,
        value,
        sub,
      };
    }

    function targetText(target) {
      if (target.includes("Index")) return "中证2000指数";
      if (target.includes("ETF")) return "中证2000 ETF";
      return target;
    }

    function typeText(type) {
      if (type === "Theoretical") return "策略测算";
      if (type === "Tradable") return "ETF跟踪";
      return type;
    }

    function renderKpis(kpis) {
      $("kpis").innerHTML = kpis.map((item, index) => {
        const view = kpiView(item, index);
        const classes = [
          "kpi",
          index === 0 ? "is-action" : "",
          item.label.includes("Calmar") ? "is-risk" : "",
        ].filter(Boolean).join(" ");
        return `
        <div class="${classes}">
          <div class="kpi-label">${view.label}</div>
          <div class="kpi-value">${view.value}</div>
          <span>${view.sub}</span>
        </div>
      `;
      }).join("");
    }

    function renderPerformance(rows) {
      $("performanceRows").innerHTML = rows.map((row) => `
        <tr>
          <td>${targetText(row.target)}</td>
          <td><span class="chip">${typeText(row.type)}</span></td>
          <td class="metric-pos">${row.ann_return}</td>
          <td class="metric-risk">${row.max_dd}</td>
          <td><strong>${row.calmar}</strong></td>
          <td><strong>${row.latest_nav}</strong></td>
        </tr>
      `).join("");
    }

    function renderStatus(decision) {
      $("statusGrid").innerHTML = [
        ["当前观察日", decision.date],
        ["下次观察", decision.next_checkpoint],
        ["本期信号", signalText(decision.action)],
        ["页面版本", "公开版"],
      ].map(([label, value]) => `
        <div class="status-item">
          <span>${label}</span>
          <strong>${value}</strong>
        </div>
      `).join("");
    }

    function normalizeSeries(series) {
      return series.map((s) => ({
        ...s,
        points: s.points.map((p) => ({
          month: p.month,
          t: monthToDate(p.month).getTime(),
          nav: Number(p.nav),
        })),
      }));
    }

    function drawChart(rawSeries) {
      const series = normalizeSeries(rawSeries);
      const allPoints = series.flatMap((s) => s.points);
      const svg = $("navChart");
      svg.textContent = "";

      if (!allPoints.length) {
        svg.appendChild(createSvg("text", { x: 62, y: 60, class: "axis-label" })).textContent = "暂无数据";
        return;
      }

      const minT = Math.min(...allPoints.map((p) => p.t));
      const maxT = Math.max(...allPoints.map((p) => p.t));
      const maxY = roundUp(Math.max(...allPoints.map((p) => p.nav)) + 0.05, 0.2);
      const minY = Math.min(0.9, Math.floor(Math.min(...allPoints.map((p) => p.nav)) * 10) / 10);
      const plotW = WIDTH - PAD.left - PAD.right;
      const plotH = HEIGHT - PAD.top - PAD.bottom;
      const xScale = (t) => PAD.left + ((t - minT) / (maxT - minT || 1)) * plotW;
      const yScale = (v) => PAD.top + ((maxY - v) / (maxY - minY || 1)) * plotH;

      svg.appendChild(createSvg("text", { x: PAD.left, y: 20, class: "chart-title" })).textContent = "策略净值 vs ETF净值";
      svg.appendChild(createSvg("text", { x: PAD.left, y: 39, class: "chart-subtitle" })).textContent = "月度净值走势";
      svg.appendChild(createSvg("rect", { x: PAD.left, y: PAD.top, width: plotW, height: plotH, class: "plot-bg" }));

      const yTicks = 5;
      for (let i = 0; i < yTicks; i += 1) {
        const val = minY + ((maxY - minY) * i) / (yTicks - 1);
        const y = yScale(val);
        svg.appendChild(createSvg("line", { x1: PAD.left, x2: WIDTH - PAD.right, y1: y, y2: y, class: i === 0 ? "axis-line" : "grid-line" }));
        const label = createSvg("text", { x: PAD.left - 10, y: y + 4, class: "axis-label", "text-anchor": "end" });
        label.textContent = val.toFixed(1);
        svg.appendChild(label);
      }

      const xTickCount = 7;
      for (let i = 0; i < xTickCount; i += 1) {
        const t = minT + ((maxT - minT) * i) / (xTickCount - 1);
        const x = xScale(t);
        svg.appendChild(createSvg("line", { x1: x, x2: x, y1: PAD.top, y2: HEIGHT - PAD.bottom, class: "grid-line" }));
        const label = createSvg("text", {
          x,
          y: HEIGHT - 18,
          class: "axis-label",
          "text-anchor": i === 0 ? "start" : i === xTickCount - 1 ? "end" : "middle",
        });
        label.textContent = formatMonthFromTs(t);
        svg.appendChild(label);
      }

      let legendX = PAD.left;
      series.forEach((s) => {
        const pts = s.points.map((p) => `${xScale(p.t).toFixed(1)},${yScale(p.nav).toFixed(1)}`).join(" ");
        svg.appendChild(createSvg("polyline", { points: pts, class: "nav-line", stroke: s.color }));
        const last = s.points[s.points.length - 1];
        svg.appendChild(createSvg("circle", { cx: xScale(last.t), cy: yScale(last.nav), r: 4, fill: s.color, stroke: "#fff", "stroke-width": 2 }));
        svg.appendChild(createSvg("rect", { x: legendX, y: HEIGHT - 39, width: 10, height: 10, rx: 2, fill: s.color }));
        const text = createSvg("text", { x: legendX + 16, y: HEIGHT - 30, class: "legend-text" });
        text.textContent = `${s.label} 最新 ${s.latest_nav}`;
        svg.appendChild(text);
        legendX += 205;
      });

      const monthIndex = new Map();
      allPoints.forEach((p) => monthIndex.set(p.month, p.t));
      const months = [...monthIndex.entries()].sort((a, b) => a[1] - b[1]);

      const crosshair = createSvg("g", { class: "crosshair" });
      const vLine = createSvg("line", { x1: 0, x2: 0, y1: PAD.top, y2: HEIGHT - PAD.bottom });
      const hLine = createSvg("line", { x1: PAD.left, x2: WIDTH - PAD.right, y1: 0, y2: 0 });
      crosshair.appendChild(vLine);
      crosshair.appendChild(hLine);
      const pointDots = series.map((s) => {
        const dot = createSvg("circle", { cx: 0, cy: 0, r: 4, fill: s.color });
        dot.style.display = "none";
        crosshair.appendChild(dot);
        return dot;
      });
      svg.appendChild(crosshair);

      const overlay = createSvg("rect", {
        x: PAD.left,
        y: PAD.top,
        width: plotW,
        height: plotH,
        fill: "transparent",
        style: "cursor: crosshair;",
      });
      svg.appendChild(overlay);

      const tooltip = $("chartTooltip");
      const shell = $("chartShell");

      function nearestMonth(targetT) {
        let best = months[0];
        for (const item of months) {
          if (Math.abs(item[1] - targetT) < Math.abs(best[1] - targetT)) best = item;
        }
        return best;
      }

      function pointAtMonth(s, month) {
        return s.points.find((p) => p.month === month);
      }

      function pointerToSvg(evt) {
        const rect = svg.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        return {
          x: ((clientX - rect.left) / rect.width) * WIDTH,
          y: ((clientY - rect.top) / rect.height) * HEIGHT,
          pageX: clientX - shell.getBoundingClientRect().left,
          pageY: clientY - shell.getBoundingClientRect().top,
        };
      }

      function showCrosshair(evt) {
        const pos = pointerToSvg(evt);
        const x = Math.max(PAD.left, Math.min(WIDTH - PAD.right, pos.x));
        const y = Math.max(PAD.top, Math.min(HEIGHT - PAD.bottom, pos.y));
        const targetT = minT + ((x - PAD.left) / plotW) * (maxT - minT);
        const [month, snappedT] = nearestMonth(targetT);
        const snappedX = xScale(snappedT);

        crosshair.style.display = "block";
        vLine.setAttribute("x1", snappedX);
        vLine.setAttribute("x2", snappedX);
        hLine.setAttribute("y1", y);
        hLine.setAttribute("y2", y);

        const rows = series.map((s, i) => {
          const p = pointAtMonth(s, month);
          if (p) {
            pointDots[i].style.display = "block";
            pointDots[i].setAttribute("cx", snappedX);
            pointDots[i].setAttribute("cy", yScale(p.nav));
          } else {
            pointDots[i].style.display = "none";
          }
          const value = p ? p.nav.toFixed(2) : "--";
          return `<div class="tooltip-row"><span><i class="swatch" style="background:${s.color}"></i>${s.label}</span><b>${value}</b></div>`;
        }).join("");

        tooltip.innerHTML = `<strong>${month}</strong>${rows}`;
        tooltip.style.display = "block";
        const left = Math.min(Math.max(pos.pageX + 12, 8), shell.clientWidth - tooltip.offsetWidth - 8);
        const top = Math.min(Math.max(pos.pageY + 12, 8), shell.clientHeight - tooltip.offsetHeight - 8);
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      }

      function hideCrosshair() {
        crosshair.style.display = "none";
        tooltip.style.display = "none";
      }

      overlay.addEventListener("mousemove", showCrosshair);
      overlay.addEventListener("mouseleave", hideCrosshair);
      overlay.addEventListener("touchmove", (evt) => {
        evt.preventDefault();
        showCrosshair(evt);
      }, { passive: false });
      overlay.addEventListener("touchend", hideCrosshair);
    }

    function renderDashboard(data) {
      $("snapshotMeta").textContent = `数据截至 ${data.as_of} · 更新于 ${data.generated_at}`;
      const badge = $("actionBadge");
      badge.textContent = signalText(data.decision.action);
      badge.classList.toggle("skip", data.decision.action !== "TRADE");
      renderKpis(data.kpis);
      renderPerformance(data.performance);
      renderStatus(data.decision);
      drawChart(data.series);
    }

    fetch("data/dashboard.json", { cache: "no-store" })
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(renderDashboard)
      .catch((err) => {
        $("chartShell").innerHTML = `<div class="load-error">数据加载失败：${err.message}</div>`;
        $("actionBadge").textContent = "数据更新中";
      });
  </script>
</body>
</html>
