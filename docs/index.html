<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中证2000组合策略观察 | GoFinTech Quant</title>
  <meta name="description" content="中证2000组合策略公开观察页，展示组合信号、净值、K线和历史交易记录。" />
  <meta name="theme-color" content="#0b806f" />
  <meta property="og:title" content="中证2000组合策略观察" />
  <meta property="og:description" content="跟踪组合策略净值、中证2000日线和历史买卖点。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://quant002.gofintech.cn/" />
  <link rel="canonical" href="https://quant002.gofintech.cn/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #172033;
      --muted: #667085;
      --line: #dde5ef;
      --line-soft: #eef2f7;
      --blue: #255e91;
      --green: #0b806f;
      --red: #b0443d;
      --amber: #b26a00;
      --violet: #7356a8;
      --shadow: 0 12px 34px rgba(21, 39, 65, 0.10);
      --hero: #f8fbff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: linear-gradient(180deg, var(--hero) 0 292px, var(--bg) 292px 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }
    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 26px 24px 34px;
    }
    .hero {
      display: flex;
      min-height: 202px;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }
    .hero-copy { max-width: 820px; }
    .brand-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .brand-mark {
      display: inline-grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--green), var(--blue));
      color: #ffffff;
      font-size: 15px;
      font-weight: 850;
      box-shadow: 0 10px 24px rgba(11, 128, 111, 0.18);
    }
    .brand-name {
      color: #516070;
      font-size: 13px;
      font-weight: 760;
    }
    .eyebrow {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      padding: 3px 10px;
      border: 1px solid rgba(11, 128, 111, 0.18);
      border-radius: 999px;
      background: #e7f6f2;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.16;
      font-weight: 800;
      letter-spacing: 0;
    }
    .meta {
      max-width: 860px;
      color: #526274;
      font-size: 14px;
      line-height: 1.6;
    }
    .hero-side {
      display: grid;
      min-width: 180px;
      justify-items: end;
      gap: 8px;
    }
    .badge-label {
      color: #6b7787;
      font-size: 12px;
      font-weight: 700;
    }
    .badge {
      min-width: 142px;
      padding: 13px 18px;
      border: 1px solid rgba(11, 128, 111, 0.28);
      border-radius: 8px;
      background: #ffffff;
      color: var(--green);
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      box-shadow: var(--shadow);
    }
    .badge.skip {
      color: var(--amber);
      border-color: rgba(178, 106, 0, 0.25);
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin: 4px 0 16px;
    }
    .kpi, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(21, 39, 65, 0.07);
    }
    .kpi {
      position: relative;
      min-height: 112px;
      overflow: hidden;
      padding: 15px;
    }
    .kpi::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--blue);
    }
    .kpi.is-action::before { background: var(--green); }
    .kpi.is-risk::before { background: var(--amber); }
    .kpi-label {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .kpi-value {
      color: var(--ink);
      font-size: 25px;
      line-height: 1.15;
      font-weight: 800;
      white-space: nowrap;
    }
    .kpi span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }
    .panel {
      padding: 18px;
      overflow: hidden;
    }
    .wide-panel {
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .panel h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 800;
    }
    .section-kicker {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .chart-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    button {
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: #334155;
      font: inherit;
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
    }
    button:hover { background: var(--panel-soft); }
    button.is-active {
      border-color: rgba(37, 94, 145, 0.34);
      background: #eaf3fb;
      color: var(--blue);
    }
    .canvas-shell {
      position: relative;
      width: 100%;
      min-height: 472px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 472px;
      touch-action: none;
      cursor: crosshair;
    }
    .chart-tooltip {
      position: absolute;
      display: none;
      min-width: 206px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: var(--shadow);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      z-index: 4;
    }
    .chart-tooltip strong {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      white-space: nowrap;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
    }
    .dot.buy { background: var(--blue); }
    .dot.sell { background: var(--violet); }
    .dot.up { background: var(--red); }
    .dot.down { background: var(--green); }
    .table-scroll {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }
    .trade-table-scroll {
      max-height: 440px;
    }
    table {
      width: 100%;
      min-width: 680px;
      border-collapse: collapse;
      font-size: 13px;
      background: #ffffff;
    }
    th, td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--line-soft);
      text-align: right;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: #475467;
      background: var(--panel-soft);
      font-size: 12px;
      font-weight: 800;
    }
    th:first-child, td:first-child { text-align: left; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fbfdff; }
    .chip {
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eaf3fb;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
    }
    .chip.gap {
      background: #e7f6f2;
      color: var(--green);
    }
    .metric-pos { color: var(--green); font-weight: 800; }
    .metric-risk { color: var(--red); font-weight: 800; }
    .status {
      display: grid;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }
    .status-item {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line-soft);
    }
    .status-item:last-child { border-bottom: 0; }
    .status-item strong {
      display: block;
      text-align: right;
      font-size: 15px;
      font-weight: 800;
    }
    .status-item span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .load-error {
      color: var(--red);
      font-size: 13px;
      padding: 12px;
      border: 1px solid rgba(185, 74, 59, 0.28);
      border-radius: 8px;
      background: rgba(185, 74, 59, 0.06);
    }
    footer {
      color: var(--muted);
      font-size: 12px;
      padding: 18px 0 0;
    }
    @media (max-width: 980px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .hero {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }
      .hero-side {
        min-width: 0;
        justify-items: start;
      }
      .section-head { flex-direction: column; }
      .chart-toolbar { justify-content: flex-start; }
    }
    @media (max-width: 560px) {
      body { background: linear-gradient(180deg, var(--hero) 0 392px, var(--bg) 392px 100%); }
      .shell { padding: 18px 14px 26px; }
      .hero { min-height: 298px; }
      h1 { font-size: 25px; }
      .meta { font-size: 13px; }
      .badge { width: 100%; }
      .kpis { grid-template-columns: 1fr; }
      .kpi { min-height: 96px; }
      .panel { padding: 14px; }
      .canvas-shell { min-height: 398px; }
      canvas { height: 398px; }
      th, td { padding: 10px 9px; }
      .status-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
      .status-item strong { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="hero-copy">
        <div class="brand-line">
          <span class="brand-mark">Q</span>
          <span class="brand-name">GoFinTech Quant</span>
          <span class="eyebrow">公开观察</span>
        </div>
        <h1>中证2000组合策略观察</h1>
        <div class="meta" id="snapshotMeta">数据更新中</div>
        <div class="meta">主策略优先叠加间断交易日腿，组合版本使用 2 个交易日冷却。</div>
      </div>
      <div class="hero-side">
        <div class="badge-label">本期信号</div>
        <div class="badge" id="actionBadge">...</div>
      </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="panel wide-panel">
      <div class="section-head">
        <div>
          <h2>中证2000日线与买卖点</h2>
          <div class="section-kicker">组合策略历史交易叠加在日线价格上。</div>
        </div>
        <div class="chart-toolbar">
          <button type="button" data-range="90">近3月</button>
          <button type="button" data-range="252">近1年</button>
          <button type="button" data-range="756">近3年</button>
          <button type="button" data-range="all">全区间</button>
        </div>
      </div>
      <div class="canvas-shell" id="klineShell">
        <canvas id="klineCanvas"></canvas>
        <div class="chart-tooltip" id="klineTooltip"></div>
      </div>
      <div class="legend">
        <span><i class="dot up"></i>上涨K线</span>
        <span><i class="dot down"></i>下跌K线</span>
        <span><i class="dot buy"></i>买入点</span>
        <span><i class="dot sell"></i>卖出点</span>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <div class="section-head">
          <div>
            <h2>核心表现</h2>
            <div class="section-kicker">组合策略指数与 ETF 口径。</div>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>观察对象</th>
                <th>口径</th>
                <th>年化</th>
                <th>最大回撤</th>
                <th>收益回撤比</th>
                <th>净值</th>
              </tr>
            </thead>
            <tbody id="performanceRows"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="section-head">
          <div>
            <h2>观察日历</h2>
            <div class="section-kicker">当前信号与下一次观察时间。</div>
          </div>
        </div>
        <div class="status" id="statusGrid"></div>
      </div>
    </section>

    <section class="panel wide-panel">
      <div class="section-head">
        <div>
          <h2>历史交易记录</h2>
          <div class="section-kicker">组合策略已完成交易。</div>
        </div>
      </div>
      <div class="table-scroll trade-table-scroll">
        <table>
          <thead>
            <tr>
              <th>信号日</th>
              <th>策略</th>
              <th>买入日</th>
              <th>卖出日</th>
              <th>买入价</th>
              <th>卖出价</th>
              <th>收益</th>
            </tr>
          </thead>
          <tbody id="tradeRows"></tbody>
        </table>
      </div>
    </section>

    <footer>公开信息仅作策略观察与交流，不构成任何投资建议。</footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const colors = {
      ink: "#172033",
      muted: "#667085",
      line: "#dde5ef",
      grid: "#eef2f7",
      up: "#b0443d",
      down: "#0b806f",
      buy: "#255e91",
      sell: "#7356a8",
      bg: "#ffffff",
      plot: "#fbfdff",
    };

    function signalText(action) {
      return action === "TRADE" ? "信号亮起" : "等待观察";
    }

    function kpiLabel(label) {
      return {
        "Next Action": "本期信号",
        "Hybrid Index Annualized": "组合指数年化",
        "Hybrid ETF Annualized": "组合ETF年化",
        "Hybrid Index Calmar": "指数收益回撤",
        "Hybrid ETF Calmar": "ETF收益回撤",
      }[label] || label;
    }

    function renderKpis(kpis) {
      $("kpis").innerHTML = kpis.map((item, index) => {
        const isAction = index === 0;
        const classes = ["kpi", isAction ? "is-action" : "", item.label.includes("Calmar") ? "is-risk" : ""].filter(Boolean).join(" ");
        return `
          <div class="${classes}">
            <div class="kpi-label">${kpiLabel(item.label)}</div>
            <div class="kpi-value">${isAction ? signalText(item.value) : item.value}</div>
            <span>${item.sub.replace("target ", "下次观察 ")}</span>
          </div>
        `;
      }).join("");
    }

    function targetText(target) {
      if (target.includes("Index")) return "组合指数";
      if (target.includes("ETF")) return "组合ETF";
      return target;
    }

    function typeText(type) {
      if (type === "Theoretical") return "指数口径";
      if (type === "Tradable") return "ETF口径";
      return type;
    }

    function renderPerformance(rows) {
      $("performanceRows").innerHTML = rows.map((row) => `
        <tr>
          <td>${targetText(row.target)}</td>
          <td><span class="chip">${typeText(row.type)}</span></td>
          <td class="metric-pos">${row.ann_return}</td>
          <td class="metric-risk">${row.max_dd}</td>
          <td><strong>${row.calmar}</strong></td>
          <td><strong>${row.latest_nav}</strong></td>
        </tr>
      `).join("");
    }

    function renderStatus(data) {
      const decision = data.decision;
      $("statusGrid").innerHTML = [
        ["数据截至", data.as_of],
        ["当前观察日", decision.date],
        ["下次观察", decision.next_checkpoint],
        ["本期信号", signalText(decision.action)],
      ].map(([label, value]) => `
        <div class="status-item">
          <span>${label}</span>
          <strong>${value}</strong>
        </div>
      `).join("");
    }

    function renderTrades(rows) {
      const ordered = [...rows].reverse();
      $("tradeRows").innerHTML = ordered.map((row) => `
        <tr>
          <td>${row.signal_date}</td>
          <td><span class="chip ${row.strategy === "间断腿" ? "gap" : ""}">${row.strategy}</span></td>
          <td>${row.entry_date} ${row.entry_timing === "open" ? "开盘" : "收盘"}</td>
          <td>${row.exit_date} ${row.exit_timing === "open" ? "开盘" : "收盘"}</td>
          <td>${Number(row.entry_px).toFixed(2)}</td>
          <td>${Number(row.exit_px).toFixed(2)}</td>
          <td class="${row.ret_pct >= 0 ? "metric-pos" : "metric-risk"}">${Number(row.ret_pct).toFixed(2)}%</td>
        </tr>
      `).join("");
    }

    class KLineChart {
      constructor(canvas, tooltip) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.tooltip = tooltip;
        this.candles = [];
        this.trades = [];
        this.markerMap = new Map();
        this.start = 0;
        this.end = 0;
        this.dragging = false;
        this.dragStartX = 0;
        this.dragStartRange = [0, 0];
        this.cross = null;
        this.padding = { left: 62, right: 72, top: 24, bottom: 34 };
        this.attachEvents();
      }

      setData(candles, trades) {
        this.candles = candles.map((d, i) => ({ ...d, i, t: Date.parse(`${d.date}T00:00:00Z`) }));
        this.trades = trades;
        this.markerMap = this.buildMarkers(trades);
        this.setRange(252);
      }

      buildMarkers(trades) {
        const map = new Map();
        const put = (date, item) => {
          if (!map.has(date)) map.set(date, []);
          map.get(date).push(item);
        };
        trades.forEach((trade) => {
          put(trade.entry_date, { side: "buy", price: Number(trade.entry_px), strategy: trade.strategy, ret: Number(trade.ret_pct) });
          put(trade.exit_date, { side: "sell", price: Number(trade.exit_px), strategy: trade.strategy, ret: Number(trade.ret_pct) });
        });
        return map;
      }

      setRange(count) {
        if (!this.candles.length) return;
        if (count === "all") {
          this.start = 0;
          this.end = this.candles.length - 1;
        } else {
          const n = Math.max(24, Math.min(Number(count), this.candles.length));
          this.end = this.candles.length - 1;
          this.start = Math.max(0, this.end - n + 1);
        }
        this.draw();
      }

      attachEvents() {
        window.addEventListener("resize", () => this.draw());
        this.canvas.addEventListener("pointerdown", (event) => {
          this.dragging = true;
          this.dragStartX = event.offsetX;
          this.dragStartRange = [this.start, this.end];
          this.canvas.setPointerCapture(event.pointerId);
        });
        this.canvas.addEventListener("pointermove", (event) => {
          const pos = this.eventPos(event);
          if (this.dragging) {
            const width = this.plotWidth();
            const visible = this.end - this.start + 1;
            const shift = Math.round(((this.dragStartX - pos.x) / Math.max(width, 1)) * visible);
            this.moveTo(this.dragStartRange[0] + shift, this.dragStartRange[1] + shift);
          }
          this.cross = pos;
          this.draw();
          this.showTooltip(pos);
        });
        this.canvas.addEventListener("pointerup", (event) => {
          this.dragging = false;
          this.canvas.releasePointerCapture(event.pointerId);
        });
        this.canvas.addEventListener("pointerleave", () => {
          if (!this.dragging) {
            this.cross = null;
            this.tooltip.style.display = "none";
            this.draw();
          }
        });
        this.canvas.addEventListener("wheel", (event) => {
          event.preventDefault();
          const pos = this.eventPos(event);
          const plot = this.plotRect();
          const anchor = Math.max(0, Math.min(1, (pos.x - plot.left) / Math.max(plot.width, 1)));
          const visible = this.end - this.start + 1;
          const next = Math.round(visible * (event.deltaY > 0 ? 1.16 : 0.86));
          this.zoomTo(next, anchor);
        }, { passive: false });
      }

      eventPos(event) {
        const rect = this.canvas.getBoundingClientRect();
        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top,
        };
      }

      resizeCanvas() {
        const rect = this.canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const width = Math.max(320, Math.floor(rect.width));
        const height = Math.max(320, Math.floor(rect.height));
        if (this.canvas.width !== Math.floor(width * dpr) || this.canvas.height !== Math.floor(height * dpr)) {
          this.canvas.width = Math.floor(width * dpr);
          this.canvas.height = Math.floor(height * dpr);
        }
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.width = width;
        this.height = height;
      }

      plotRect() {
        return {
          left: this.padding.left,
          top: this.padding.top,
          right: this.width - this.padding.right,
          bottom: this.height - this.padding.bottom,
          width: this.width - this.padding.left - this.padding.right,
          height: this.height - this.padding.top - this.padding.bottom,
        };
      }

      plotWidth() {
        return Math.max(1, this.width - this.padding.left - this.padding.right);
      }

      moveTo(start, end) {
        const visible = end - start + 1;
        if (start < 0) {
          start = 0;
          end = visible - 1;
        }
        if (end >= this.candles.length) {
          end = this.candles.length - 1;
          start = Math.max(0, end - visible + 1);
        }
        this.start = start;
        this.end = end;
      }

      zoomTo(count, anchor) {
        const minCount = 24;
        const maxCount = this.candles.length;
        const nextCount = Math.max(minCount, Math.min(maxCount, count));
        const currentCount = this.end - this.start + 1;
        const anchorIndex = this.start + Math.round(anchor * (currentCount - 1));
        let start = anchorIndex - Math.round(anchor * (nextCount - 1));
        let end = start + nextCount - 1;
        this.moveTo(start, end);
        this.draw();
      }

      visibleCandles() {
        return this.candles.slice(this.start, this.end + 1);
      }

      scales() {
        const plot = this.plotRect();
        const visible = this.visibleCandles();
        const lows = visible.map((d) => d.low);
        const highs = visible.map((d) => d.high);
        visible.forEach((d) => {
          const markers = this.markerMap.get(d.date) || [];
          markers.forEach((m) => {
            lows.push(m.price);
            highs.push(m.price);
          });
        });
        let minY = Math.min(...lows);
        let maxY = Math.max(...highs);
        const pad = (maxY - minY || 1) * 0.08;
        minY -= pad;
        maxY += pad;
        const x = (index) => plot.left + ((index - this.start + 0.5) / Math.max(1, visible.length)) * plot.width;
        const y = (value) => plot.top + ((maxY - value) / Math.max(1, maxY - minY)) * plot.height;
        return { plot, visible, minY, maxY, x, y };
      }

      draw() {
        this.resizeCanvas();
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, this.width, this.height);
        if (!this.candles.length) return;

        const s = this.scales();
        ctx.fillStyle = colors.plot;
        ctx.fillRect(s.plot.left, s.plot.top, s.plot.width, s.plot.height);
        ctx.strokeStyle = colors.grid;
        ctx.lineWidth = 1;
        ctx.font = "11px -apple-system, BlinkMacSystemFont, Segoe UI, Arial";
        ctx.fillStyle = colors.muted;
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        for (let i = 0; i < 5; i += 1) {
          const value = s.minY + ((s.maxY - s.minY) * i) / 4;
          const y = s.y(value);
          ctx.beginPath();
          ctx.moveTo(s.plot.left, y);
          ctx.lineTo(s.plot.right, y);
          ctx.stroke();
          ctx.fillText(value.toFixed(0), s.plot.left - 9, y);
        }

        const visibleCount = s.visible.length;
        const candleW = Math.max(2, Math.min(12, s.plot.width / Math.max(visibleCount, 1) * 0.62));
        s.visible.forEach((d) => {
          const x = s.x(d.i);
          const up = d.close >= d.open;
          ctx.strokeStyle = up ? colors.up : colors.down;
          ctx.fillStyle = up ? colors.up : colors.down;
          ctx.beginPath();
          ctx.moveTo(x, s.y(d.high));
          ctx.lineTo(x, s.y(d.low));
          ctx.stroke();
          const yOpen = s.y(d.open);
          const yClose = s.y(d.close);
          const y = Math.min(yOpen, yClose);
          const h = Math.max(1, Math.abs(yClose - yOpen));
          ctx.fillRect(x - candleW / 2, y, candleW, h);
        });

        this.drawMarkers(s);
        this.drawXAxis(s);
        if (this.cross) this.drawCrosshair(s);
      }

      drawMarkers(s) {
        const ctx = this.ctx;
        s.visible.forEach((d) => {
          const markers = this.markerMap.get(d.date) || [];
          markers.forEach((marker, idx) => {
            const x = s.x(d.i) + (idx % 3 - 1) * 7;
            const y = s.y(marker.price);
            ctx.fillStyle = marker.side === "buy" ? colors.buy : colors.sell;
            ctx.beginPath();
            if (marker.side === "buy") {
              ctx.moveTo(x, y - 7);
              ctx.lineTo(x - 6, y + 5);
              ctx.lineTo(x + 6, y + 5);
            } else {
              ctx.moveTo(x, y + 7);
              ctx.lineTo(x - 6, y - 5);
              ctx.lineTo(x + 6, y - 5);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.2;
            ctx.stroke();
          });
        });
      }

      drawXAxis(s) {
        const ctx = this.ctx;
        ctx.fillStyle = colors.muted;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.font = "11px -apple-system, BlinkMacSystemFont, Segoe UI, Arial";
        const ticks = Math.min(7, s.visible.length);
        for (let i = 0; i < ticks; i += 1) {
          const pos = Math.round((s.visible.length - 1) * i / Math.max(1, ticks - 1));
          const d = s.visible[pos];
          const x = s.x(d.i);
          ctx.fillText(d.date.slice(0, 7), x, s.plot.bottom + 10);
        }
      }

      drawCrosshair(s) {
        const ctx = this.ctx;
        const plot = s.plot;
        const x = Math.max(plot.left, Math.min(plot.right, this.cross.x));
        const y = Math.max(plot.top, Math.min(plot.bottom, this.cross.y));
        ctx.save();
        ctx.strokeStyle = "#7d8794";
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, plot.top);
        ctx.lineTo(x, plot.bottom);
        ctx.moveTo(plot.left, y);
        ctx.lineTo(plot.right, y);
        ctx.stroke();
        ctx.restore();
      }

      nearestIndex(pos) {
        const s = this.scales();
        const rel = (pos.x - s.plot.left) / Math.max(1, s.plot.width);
        const offset = Math.round(rel * s.visible.length - 0.5);
        return Math.max(this.start, Math.min(this.end, this.start + offset));
      }

      showTooltip(pos) {
        if (!this.candles.length) return;
        const index = this.nearestIndex(pos);
        const d = this.candles[index];
        const markers = this.markerMap.get(d.date) || [];
        const markerHtml = markers.map((m) => `
          <div class="tooltip-row">
            <span>${m.side === "buy" ? "买入" : "卖出"} ${m.strategy}</span>
            <b>${m.price.toFixed(2)}</b>
          </div>
        `).join("");
        this.tooltip.innerHTML = `
          <strong>${d.date}</strong>
          <div class="tooltip-row"><span>开盘</span><b>${d.open.toFixed(2)}</b></div>
          <div class="tooltip-row"><span>最高</span><b>${d.high.toFixed(2)}</b></div>
          <div class="tooltip-row"><span>最低</span><b>${d.low.toFixed(2)}</b></div>
          <div class="tooltip-row"><span>收盘</span><b>${d.close.toFixed(2)}</b></div>
          ${markerHtml}
        `;
        this.tooltip.style.display = "block";
        const shell = $("klineShell");
        const left = Math.min(Math.max(pos.x + 14, 8), shell.clientWidth - this.tooltip.offsetWidth - 8);
        const top = Math.min(Math.max(pos.y + 14, 8), shell.clientHeight - this.tooltip.offsetHeight - 8);
        this.tooltip.style.left = `${left}px`;
        this.tooltip.style.top = `${top}px`;
      }
    }

    function setupRangeButtons(chart) {
      document.querySelectorAll("[data-range]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-range]").forEach((el) => el.classList.remove("is-active"));
          button.classList.add("is-active");
          chart.setRange(button.dataset.range);
        });
      });
      const defaultButton = document.querySelector('[data-range="252"]');
      if (defaultButton) defaultButton.classList.add("is-active");
    }

    function renderDashboard(data) {
      $("snapshotMeta").textContent = `数据截至 ${data.as_of} · 更新于 ${data.generated_at}`;
      const badge = $("actionBadge");
      badge.textContent = signalText(data.decision.action);
      badge.classList.toggle("skip", data.decision.action !== "TRADE");
      renderKpis(data.kpis);
      renderPerformance(data.performance);
      renderStatus(data);
      renderTrades(data.hybrid.trades || []);

      const chart = new KLineChart($("klineCanvas"), $("klineTooltip"));
      chart.setData(data.hybrid.candles || [], data.hybrid.trades || []);
      setupRangeButtons(chart);
    }

    fetch("data/dashboard.json", { cache: "no-store" })
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(renderDashboard)
      .catch((err) => {
        $("klineShell").innerHTML = `<div class="load-error">数据加载失败：${err.message}</div>`;
        $("actionBadge").textContent = "数据更新中";
      });
  </script>
</body>
</html>
